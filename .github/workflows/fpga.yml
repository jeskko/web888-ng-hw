# SPDX-License-Identifier: GPL-3.0-or-later
name: fpga

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["fpga/**", ".github/workflows/fpga.yml"]
  pull_request:
    paths: ["fpga/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fpga-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # RTL simulation on GitHub-hosted runners: for pull requests (fork code
  # must not reach the project's runner), and for pushes while there is no
  # self-hosted runner. Otherwise the bitstreams job simulates first.
  sim:
    if: github.event_name == 'pull_request' || vars.SELF_HOSTED_RUNNER != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y iverilog python3-numpy
      - run: make -C fpga sim PYTHON=python3

  # Bitstreams on the project's self-hosted Vivado runner (web888-ng-os
  # ci/runner, instance "hw"). Never for pull requests (fork code must not
  # reach the runner); off until the repository variable
  # SELF_HOSTED_RUNNER is "true".
  bitstreams:
    if: github.event_name != 'pull_request' && vars.SELF_HOSTED_RUNNER == 'true'
    runs-on: [self-hosted, linux, vivado]
    timeout-minutes: 240
    env:
      VIVADO: /data/vivado/2026.1/Vivado/bin/vivado
      LD_LIBRARY_PATH: /opt/vivado-compat
      LD_PRELOAD: /lib/x86_64-linux-gnu/libudev.so.1
    steps:
      - uses: actions/checkout@v4
      - name: simulate
        # Icarus Verilog and numpy are in the runner image (web888-ng-os
        # ci/runner/Containerfile); the frozen HF/VHF designs too (they
        # share the NCO, the register file and the ring writer)
        run: make -C fpga sim PYTHON=python3
      - name: licence
        # warns 30 days ahead (exit 2), fails if expired or missing (1)
        run: fpga/scripts/licence-check.sh > licence.txt || [ $? -eq 2 ]
      - name: build
        # the channelizers, HF and VHF (docs/channelizer.md). The
        # stock-compatible websdr_hf.bit / websdr_vhf.bit are frozen at
        # v0.5.0 (fpga/README.md): `make hf vhf` by hand if ever needed.
        run: make -C fpga pfb pfb_vhf VIVADO="$VIVADO" JOBS=8
      - name: timing
        # build.tcl only warns; a release must meet timing (with guardband)
        run: |
          for v in pfb pfb_vhf; do
            wns=$(sed -n 's/^WNS: \([-0-9.]*\) ns.*/\1/p' fpga/build/$v.log | tail -n 1)
            echo "$v: WNS $wns ns" | tee -a "$GITHUB_STEP_SUMMARY" wns.txt
            awk -v w="$wns" 'BEGIN { exit !(w != "" && w + 0 >= 0) }' ||
              { echo "::error::$v: timing not met (WNS '$wns')"; exit 1; }
          done
      - name: collect
        run: |
          mkdir out
          cp wns.txt licence.txt out/
          for v in pfb pfb_vhf; do
            cp fpga/build/$v/websdr_$v.bit out/
            cp fpga/build/$v/timing.txt out/timing_$v.txt
            cp fpga/build/$v/utilization.txt out/utilization_$v.txt
          done
          # PS7 init (the same PS configuration in every build)
          mkdir out/ps7_init && cp fpga/build/pfb/ps7_init* out/ps7_init/
          cd out && sha256sum websdr_*.bit > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: bitstreams
          path: out/
          if-no-files-found: error
      # synthesis utilisation (per module), also when implementation
      # failed, and the timing reports (paths too) when timing wasn't met
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: channelizer-synth
          path: |
            fpga/build/pfb*/synth_utilization*.txt
            fpga/build/pfb*/timing*.txt
            fpga/build/pfb*/utilization.txt

  # Tags: publish the bitstreams as release assets (web888-ng-os fetches
  # them from there by checksum).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bitstreams
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
          sparse-checkout: docs/release-notes
      - uses: actions/download-artifact@v4
        with:
          name: bitstreams
          path: out
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # release assets are files: the PS7 init (U-Boot SPL) as one
          tar -C out -czf out/ps7_init.tar.gz ps7_init && rm -rf out/ps7_init
          pre=
          case "$GITHUB_REF_NAME" in v0.*) pre=--prerelease ;; esac
          {
            echo "Open Web-888 FPGA bitstreams, built by CI (Vivado 2026.1) from this tag."
            echo
            echo "* \`websdr_pfb.bit\`: the channelizer, HF in 30 kHz bins + a tuner for 32 users (signature \`0x0E5D2010\`; its own register map, \`docs/channelizer.md\`)"
            echo "* \`websdr_pfb_vhf.bit\`: the channelizer for a 98.304 MHz ADC clock: VHF 98.3-147.5 MHz (undersampled) in 24 kHz bins + a tuner for 32 users (signature \`0x0E5D2110\`)"
            echo "* \`ps7_init.tar.gz\`: the PS7 initialisation (DDR, MIO, clocks) for a first-stage loader"
            echo "* \`SHA256SUMS\`, timing and utilization reports"
            echo
            echo "The stock-compatible \`websdr_hf.bit\` / \`websdr_vhf.bit\` are frozen: the last builds are in release v0.5.0, the hardware-tested HF one in v0.2.0."
            echo
            sed 's/^/Timing (with guardband): /' out/wns.txt
            # what's new and how it was tested, if written down for this tag
            notes="src/docs/release-notes/$GITHUB_REF_NAME.md"
            if [ -f "$notes" ]; then
              echo
              cat "$notes"
            elif [ -n "$pre" ]; then
              echo
              echo "**Pre-release: not yet tested on hardware.** Simulation and timing only. Follow \`docs/hardware-test-plan.md\` before using it on a unit you can't power-cycle."
            fi
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md $pre out/*
