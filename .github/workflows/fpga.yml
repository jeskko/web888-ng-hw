# SPDX-License-Identifier: GPL-3.0-or-later
name: fpga

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["fpga/**", ".github/workflows/fpga.yml"]
  pull_request:
    paths: ["fpga/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fpga-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # RTL simulation on GitHub-hosted runners, also for pull requests.
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y iverilog python3-numpy
      - run: make -C fpga sim PYTHON=python3

  # Bitstreams on the project's self-hosted Vivado runner (web888-ng-os
  # ci/runner, instance "hw"). Never for pull requests (fork code must not
  # reach the runner); off until the repository variable
  # SELF_HOSTED_RUNNER is "true".
  bitstreams:
    if: github.event_name != 'pull_request' && vars.SELF_HOSTED_RUNNER == 'true'
    needs: sim
    runs-on: [self-hosted, linux, vivado]
    timeout-minutes: 240
    env:
      VIVADO: /data/vivado/2026.1/Vivado/bin/vivado
      LD_LIBRARY_PATH: /opt/vivado-compat
      LD_PRELOAD: /lib/x86_64-linux-gnu/libudev.so.1
    steps:
      - uses: actions/checkout@v4
      - name: licence
        # warns 30 days ahead (exit 2), fails if expired or missing (1)
        run: fpga/scripts/licence-check.sh > licence.txt || [ $? -eq 2 ]
      - name: build
        run: make -C fpga hf vhf VIVADO="$VIVADO" JOBS=8
      - name: timing
        # build.tcl only warns; a release must meet timing (with guardband)
        run: |
          for v in hf vhf; do
            wns=$(sed -n 's/^WNS: \([-0-9.]*\) ns.*/\1/p' fpga/build/$v.log | tail -n 1)
            echo "$v: WNS $wns ns" | tee -a "$GITHUB_STEP_SUMMARY" wns.txt
            awk -v w="$wns" 'BEGIN { exit !(w != "" && w + 0 >= 0) }' ||
              { echo "::error::$v: timing not met (WNS '$wns')"; exit 1; }
          done
      - name: collect
        run: |
          mkdir out
          cp wns.txt licence.txt out/
          for v in hf vhf; do
            cp fpga/build/$v/websdr_$v.bit out/
            cp fpga/build/$v/timing.txt out/timing_$v.txt
            cp fpga/build/$v/utilization.txt out/utilization_$v.txt
          done
          # PS7 init (the same PS configuration in both)
          mkdir out/ps7_init && cp fpga/build/hf/ps7_init* out/ps7_init/
          cd out && sha256sum websdr_*.bit > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: bitstreams
          path: out/
          if-no-files-found: error
      - name: channelizer bitstream
        # web888_core PFB = 1 (docs/channelizer.md); reported, not gating,
        # and not released yet
        continue-on-error: true
        run: |
          make -C fpga pfb VIVADO="$VIVADO" JOBS=8
          wns=$(sed -n 's/^WNS: \([-0-9.]*\) ns.*/\1/p' fpga/build/pfb.log | tail -n 1)
          echo "channelizer: WNS $wns ns" | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir pfb && echo "WNS $wns ns" > pfb/wns.txt
          cp fpga/build/pfb/websdr_pfb.bit pfb/
          cp fpga/build/pfb/timing.txt pfb/timing_pfb.txt
          cp fpga/build/pfb/timing_paths.txt pfb/timing_paths_pfb.txt
          cp fpga/build/pfb/utilization.txt pfb/utilization_pfb.txt
          cd pfb && sha256sum websdr_pfb.bit > SHA256SUMS
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: channelizer
          path: pfb/
      # synthesis utilisation (per module), also when implementation failed
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: channelizer-synth
          path: fpga/build/pfb/synth_utilization*.txt

  # Tags: publish the bitstreams as release assets (web888-ng-os fetches
  # them from there by checksum).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bitstreams
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
          sparse-checkout: docs/release-notes
      - uses: actions/download-artifact@v4
        with:
          name: bitstreams
          path: out
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=
          case "$GITHUB_REF_NAME" in v0.*) pre=--prerelease ;; esac
          {
            echo "Open Web-888 FPGA bitstreams for the stock-compatible register map, built by CI (Vivado 2026.1) from this tag."
            echo
            echo "* \`websdr_hf.bit\`: HF, 12 RX + 2 WF (signature \`0x0E5D020C\`)"
            echo "* \`websdr_vhf.bit\`: VHF, 13 RX + 2 WF (signature \`0x0E5D020D\`)"
            echo "* \`SHA256SUMS\`, timing and utilization reports"
            echo
            sed 's/^/Timing (with guardband): /' out/wns.txt
            # what's new and how it was tested, if written down for this tag
            notes="src/docs/release-notes/$GITHUB_REF_NAME.md"
            if [ -f "$notes" ]; then
              echo
              cat "$notes"
            elif [ -n "$pre" ]; then
              echo
              echo "**Pre-release: not yet tested on hardware.** Simulation and timing only. Follow \`docs/hardware-test-plan.md\` before using it on a unit you can't power-cycle."
            fi
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md $pre out/*
